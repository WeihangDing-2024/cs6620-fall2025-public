name: Build and Push Docker Image

# Requirement: Trigger on push to the week02 branch
on:
  push:
    branches: [ "week02" ]

# Define environment variables for readability
env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Requirement: Check out your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Requirement: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Requirement: Log into Docker Hub using secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Helper step to generate metadata (tags and labels)
      # Requirement: Tags (latest, commit SHA)
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      # Requirement: Build and push the image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            build.run_number=${{ github.run_number }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # Configure AWS credentials using GitHub secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Deploy the Docker container to EC2 instance via AWS SSM
      - name: Deploy to EC2 via SSM
        id: ssm-deploy
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy cs6620-app Docker container from GitHub Actions" \
            --parameters 'commands=[
              "echo Pulling latest Docker image...",
              "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest",
              "echo Stopping existing container...",
              "docker stop cs6620-app || true",
              "echo Removing old container...",
              "docker rm cs6620-app || true",
              "echo Starting new container...",
              "docker run -d --name cs6620-app -p 80:5000 --restart unless-stopped ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest",
              "echo Deployment complete!"
            ]' \
            --output json > ssm-output.json
          cat ssm-output.json
          echo "command-id=$(cat ssm-output.json | jq -r '.Command.CommandId')" >> $GITHUB_OUTPUT

      # Verify deployment was sent successfully
      - name: Verify deployment command sent
        run: |
          COMMAND_ID="${{ steps.ssm-deploy.outputs.command-id }}"
          echo "Deployment command sent successfully!"
          echo "Command ID: $COMMAND_ID"
          echo "You can check the execution status in AWS Systems Manager Run Command console"
          echo "Or use: aws ssm get-command-invocation --command-id $COMMAND_ID --instance-id ${{ secrets.EC2_INSTANCE_ID }}"
